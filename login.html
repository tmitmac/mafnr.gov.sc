<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Ministry of Agriculture, Fisheries, and Natural Resources</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Open Sans',sans-serif;
}
</style>

</head>

<body class="bg-gray-100">

<div class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">

            <!-- Back Button -->
            <a href="index.html"
            class="inline-flex items-center gap-2 text-gray-600 hover:text-green-700 font-medium transition mb-6">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 19l-7-7 7-7"/>
                </svg>
                Back
            </a>

            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <img src="images/login-logo.png"
                     alt="MAFNR Logo"
                     class="h-20 w-auto">
            </div>

            <h1 class="text-3xl font-bold text-gray-900 text-center">
                Sign in
            </h1>

            <p class="text-gray-500 text-center mt-2 mb-8">
                MyMAFNR
            </p>

            <form>

                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        MAFNR Number
                    </label>

                    <input
                        type="email"
                        placeholder="12345678"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="••••••••"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>

                <div class="flex justify-between items-center mb-6">

                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" class="text-green-700 hover:underline text-sm">
                        Forgot password?
                    </a>

                </div>

                <button
                    class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-3 rounded-lg transition">
                    Sign In
                </button>

            </form>

        </div>

        <p class="text-center text-sm text-gray-500 mt-6">
            © 2026 Ministry of Agriculture, Fisheries, and Natural Resources
        </p>

    </div>

</div>

</body>
</html>
